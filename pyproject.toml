[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
python_files = ["test_*.py"]
addopts = "-q --cov=modules --cov-report=term-missing"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["backend", "backend/modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.per-file-ignores]
# runs untrusted candidate code in an isolated subprocess (see module docstring)
"backend/modules/coding_challenges.py" = ["S603", "S607"]
