<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Minimal Frontend</title>
    <style>body{font-family:Segoe UI,Roboto,Helvetica,Arial;margin:2rem}</style>
  </head>
  <body>
    <h1>Minimal Frontend</h1>
    <p>This static page checks the backend health endpoint.</p>
    <button id="check">Check API</button>
    <pre id="out"></pre>
    <script>
      document.getElementById('check').addEventListener('click', async () => {
        const out = document.getElementById('out');
        out.textContent = 'Checking...';
        try {
          const res = await fetch('/api/health');
          const json = await res.json();
          out.textContent = JSON.stringify(json, null, 2);
        } catch (e) {
          out.textContent = 'Error: ' + e;
        }
      });
    </script>
  </body>
</html>
